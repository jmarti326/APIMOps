#
# This pipeline publishes (restores) Azure API Management configurations
# from the repository back to the APIM service.
#
# Based on Azure/apiops project patterns
#

name: Restore APIM Configuration

trigger: none # Manual trigger only

parameters:
  - name: apimServiceName
    displayName: 'Target APIM Service Name'
    type: string
    default: ''
  - name: resourceGroupName
    displayName: 'Target Resource Group Name'  
    type: string
    default: ''
  - name: artifactsFolderPath
    displayName: 'Artifacts Folder Path'
    type: string
    default: 'artifacts'
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - test
      - staging
      - prod
  - name: confirmRestore
    displayName: 'Confirm Restore (Production environments require confirmation)'
    type: boolean
    default: false

variables:
  - name: apiops_release_version
    value: 'v5.1.3'  # Update to latest version as needed
  - name: vmImage
    value: 'ubuntu-latest'

pool:
  vmImage: $(vmImage)

stages:
  - stage: PreflightCheck
    displayName: 'Preflight Checks'
    jobs:
      - job: ValidateInputs
        displayName: 'Validate Inputs'
        steps:
          - checkout: self
          
          - task: PowerShell@2
            displayName: 'Validate Parameters'
            inputs:
              targetType: 'inline'
              script: |
                # Validate required parameters
                if ([string]::IsNullOrWhiteSpace("${{ parameters.apimServiceName }}")) {
                    Write-Error "APIM Service Name is required"
                    exit 1
                }
                
                if ([string]::IsNullOrWhiteSpace("${{ parameters.resourceGroupName }}")) {
                    Write-Error "Resource Group Name is required"
                    exit 1
                }
                
                # Check if artifacts folder exists
                $artifactsPath = "$(System.DefaultWorkingDirectory)/${{ parameters.artifactsFolderPath }}"
                if (-not (Test-Path $artifactsPath)) {
                    Write-Error "Artifacts folder not found at: $artifactsPath"
                    Write-Host "Available folders:"
                    Get-ChildItem "$(System.DefaultWorkingDirectory)" -Directory
                    exit 1
                }
                
                Write-Host "✓ All parameters validated"
                Write-Host "Target APIM: ${{ parameters.apimServiceName }}"
                Write-Host "Target RG: ${{ parameters.resourceGroupName }}"
                Write-Host "Environment: ${{ parameters.environment }}"
                Write-Host "Artifacts Path: $artifactsPath"

          - task: PowerShell@2
            displayName: 'Production Safety Check'
            condition: and(eq('${{ parameters.environment }}', 'prod'), eq('${{ parameters.confirmRestore }}', false))
            inputs:
              targetType: 'inline'
              script: |
                Write-Error "##[error]Production environment requires confirmation!"
                Write-Host "##[warning]To restore to production:"
                Write-Host "1. Set 'Confirm Restore' parameter to true"
                Write-Host "2. Ensure you have reviewed all changes"
                Write-Host "3. Coordinate with your team"
                exit 1

  - stage: Publish
    displayName: 'Publish APIM Configurations'
    dependsOn: PreflightCheck
    jobs:
      - deployment: PublishAPIM
        displayName: 'Publish to APIM'
        environment: ${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 'Azure Login Check'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      echo "Checking Azure connection..."
                      az account show

                - task: PowerShell@2
                  displayName: 'Download Publisher'
                  inputs:
                    targetType: 'inline'
                    script: |
                      # Download the publisher tool from the GitHub release
                      $publisherUrl = "https://github.com/Azure/apiops/releases/download/$(apiops_release_version)/publisher-linux-x64.zip"
                      Write-Host "Downloading publisher from: $publisherUrl"
                      
                      Invoke-WebRequest -Uri $publisherUrl -OutFile "publisher.zip"
                      Expand-Archive -Path "publisher.zip" -DestinationPath "$(Agent.TempDirectory)/publisher" -Force
                      
                      # Make the publisher executable
                      chmod +x "$(Agent.TempDirectory)/publisher/publisher"
                      
                      # Verify download
                      ls -la "$(Agent.TempDirectory)/publisher/"

                - task: PowerShell@2
                  displayName: 'Prepare Configuration Override'
                  inputs:
                    targetType: 'inline'
                    script: |
                      # Create configuration override file for the target environment
                      $configPath = "$(System.DefaultWorkingDirectory)/configuration.${{ parameters.environment }}.yaml"
                      
                      $configContent = @"
                      apimServiceName: ${{ parameters.apimServiceName }}
                      resourceGroupName: ${{ parameters.resourceGroupName }}
                      namedValues:
                        # Add environment-specific named values here
                        # Example:
                        # - name: environment
                        #   value: ${{ parameters.environment }}
                      backends:
                        # Add environment-specific backend URLs here
                        # Example:
                        # - name: backend-service
                        #   url: https://api-${{ parameters.environment }}.company.com
                      "@
                      
                      $configContent | Out-File -FilePath $configPath -Encoding UTF8
                      Write-Host "Created configuration file: $configPath"
                      Get-Content $configPath

                - task: AzureCLI@2
                  displayName: 'Publish APIM Configurations'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      # Set environment variables for the publisher
                      export API_MANAGEMENT_SERVICE_NAME="${{ parameters.apimServiceName }}"
                      export RESOURCE_GROUP_NAME="${{ parameters.resourceGroupName }}"
                      export API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH="$(System.DefaultWorkingDirectory)/${{ parameters.artifactsFolderPath }}"
                      export CONFIGURATION_YAML_PATH="$(System.DefaultWorkingDirectory)/configuration.${{ parameters.environment }}.yaml"
                      export AZURE_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                      export AZURE_TENANT_ID="$(az account show --query tenantId -o tsv)"
                      export AZURE_CLIENT_ID="$servicePrincipalId"
                      export AZURE_CLIENT_SECRET="$servicePrincipalKey"
                      
                      echo "Publishing to APIM Service: $API_MANAGEMENT_SERVICE_NAME"
                      echo "Resource Group: $RESOURCE_GROUP_NAME"
                      echo "Source Path: $API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH"
                      echo "Configuration: $CONFIGURATION_YAML_PATH"
                      echo "Environment: ${{ parameters.environment }}"
                      
                      # Verify artifacts exist
                      if [ ! -d "$API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH" ]; then
                        echo "##[error]Artifacts folder not found: $API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH"
                        exit 1
                      fi
                      
                      echo "Available artifacts:"
                      find "$API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH" -type f -name "*.json" -o -name "*.xml" -o -name "*.yaml" | head -10
                      
                      # Run the publisher
                      echo "Starting APIM configuration restore..."
                      "$(Agent.TempDirectory)/publisher/publisher"
                      
                      echo "##[section]APIM configuration restore completed successfully!"

                - task: AzureCLI@2
                  displayName: 'Verify Deployment'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      echo "Verifying APIM service status..."
                      
                      # Get APIM service status
                      apim_status=$(az apim show \
                        --name "${{ parameters.apimServiceName }}" \
                        --resource-group "${{ parameters.resourceGroupName }}" \
                        --query "provisioningState" -o tsv)
                      
                      echo "APIM Status: $apim_status"
                      
                      if [ "$apim_status" = "Succeeded" ]; then
                        echo "✓ APIM service is healthy"
                        
                        # Get API count
                        api_count=$(az apim api list \
                          --service-name "${{ parameters.apimServiceName }}" \
                          --resource-group "${{ parameters.resourceGroupName }}" \
                          --query "length(@)" -o tsv)
                        
                        echo "✓ Total APIs deployed: $api_count"
                        
                        # Get service URL
                        gateway_url=$(az apim show \
                          --name "${{ parameters.apimServiceName }}" \
                          --resource-group "${{ parameters.resourceGroupName }}" \
                          --query "gatewayUrl" -o tsv)
                        
                        echo "✓ Gateway URL: $gateway_url"
                        echo "##[section]Deployment verification completed successfully!"
                      else
                        echo "##[warning]APIM service status: $apim_status"
                        echo "Please check the service manually in the Azure Portal"
                      fi

  - stage: PostDeployment
    displayName: 'Post-Deployment Actions'
    dependsOn: Publish
    condition: succeeded()
    jobs:
      - job: Notification
        displayName: 'Send Notifications'
        steps:
          - task: PowerShell@2
            displayName: 'Summary Report'
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "##[section]=== APIM Restore Summary ==="
                Write-Host "✓ Target Service: ${{ parameters.apimServiceName }}"
                Write-Host "✓ Resource Group: ${{ parameters.resourceGroupName }}"
                Write-Host "✓ Environment: ${{ parameters.environment }}"
                Write-Host "✓ Pipeline: $(Build.BuildNumber)"
                Write-Host "✓ Timestamp: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')"
                Write-Host ""
                Write-Host "##[section]=== Next Steps ==="
                Write-Host "1. Verify APIs are working as expected"
                Write-Host "2. Run integration tests if available"
                Write-Host "3. Monitor APIM service health"
                Write-Host "4. Update documentation if needed"
                Write-Host ""
                Write-Host "Azure Portal: https://portal.azure.com/#@/resource/subscriptions/$(az account show --query id -o tsv)/resourceGroups/${{ parameters.resourceGroupName }}/providers/Microsoft.ApiManagement/service/${{ parameters.apimServiceName }}/overview"